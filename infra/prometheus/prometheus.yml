global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local
    env: dev

scrape_configs:
  # ── The Reliability Copilot backend ────────────────────────────────────────
  # Scrapes the /metrics endpoint exposed by opentelemetry-exporter-prometheus.
  # Start the backend with OTEL_ENABLED=true and it will appear here.
  - job_name: reliability-copilot
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # ── OTel Collector self-metrics ────────────────────────────────────────────
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
    scrape_interval: 30s

  # ── OTel Collector Prometheus exporter ────────────────────────────────────
  # Metrics forwarded from the app via OTLP → Collector → Prometheus
  - job_name: otel-collector-metrics
    static_configs:
      - targets: ["otel-collector:8889"]
    scrape_interval: 15s

  # ── Redis exporter (optional — uncomment if using redis-exporter) ──────────
  # - job_name: redis
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # ── Prometheus self-monitoring ─────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s
