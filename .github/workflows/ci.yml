name: CI/CD - AI Platform Reliability Copilot

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Global env — safe defaults (no real keys needed)
env:
  PYTHONPATH: ${{ github.workspace }}
  APP_ENV: test
  LLM_PROVIDER: mock
  OTEL_ENABLED: "false"
  REDIS_ENABLED: "false"
  AUTH_ENABLED: "false"
  LOG_FORMAT: console
  LOG_LEVEL: WARNING

jobs:
  # ── Stage 1: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Ruff lint (uses ruff.toml config)
        run: ruff check backend/ evals/

      - name: Mypy type check
        run: mypy backend/ --ignore-missing-imports --no-strict-optional || true

  # ── Stage 2: Security Scan ────────────────────────────────────────────────
  security:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install bandit
      - run: bandit -r backend/ -ll -x backend/tests || true

  # ── Stage 3: Unit Tests ───────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic test data
        run: python data/generate_synthetic_data.py

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ -q \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=50 \
            -x

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ── Stage 4: Eval Quality Gate ────────────────────────────────────────────
  evals:
    name: Eval Quality Gate
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data
        run: python data/generate_synthetic_data.py

      - name: Run eval suite (golden set)
        run: |
          python -m evals.runner \
            --dataset=golden_set \
            --threshold-groundedness=0.70 \
            --threshold-hallucination=0.15 \
            --threshold-relevance=0.65 \
            --output=eval_report.md

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval_report.md

  # ── Stage 5: Docker Build ─────────────────────────────────────────────────
  # Builds and pushes to GitHub Container Registry (ghcr.io).
  # GITHUB_TOKEN has write:packages permission by default for public repos.
  docker:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/reliability-copilot:latest
            ghcr.io/${{ github.repository_owner }}/reliability-copilot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test pushed image
        run: |
          docker run -d --name copilot-smoke \
            -p 8000:8000 \
            -e LLM_PROVIDER=mock \
            -e OTEL_ENABLED=false \
            -e REDIS_ENABLED=false \
            ghcr.io/${{ github.repository_owner }}/reliability-copilot:${{ github.sha }}
          echo "Waiting for startup..."
          sleep 20
          curl -f http://localhost:8000/health || (docker logs copilot-smoke && exit 1)
          curl -f http://localhost:8000/services || exit 1
          docker stop copilot-smoke

  # ── Stage 6: Deployment Summary ───────────────────────────────────────────
  deploy:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [docker, evals]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK_URL" -H "Content-Type: application/json"
            echo "Render deploy hook triggered"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set - skipping auto-deploy"
          fi

      - name: Write deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker image:** \`ghcr.io/${{ github.repository_owner }}/reliability-copilot:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | https://ai-platform-reliability-copilot-api.onrender.com/health |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | https://ai-platform-reliability-copilot-mmkajbee2t4acamzwu852j.streamlit.app/ |" >> $GITHUB_STEP_SUMMARY
          echo "| API Docs | https://ai-platform-reliability-copilot-api.onrender.com/docs |" >> $GITHUB_STEP_SUMMARY
